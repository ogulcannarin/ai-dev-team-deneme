name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      LLM_PROVIDER: mock
      DEFAULT_PLANNER_MODE: deterministic
      DEFAULT_CODER_MODE: deterministic
      EXECUTION_ENGINE: mock
      RUN_LIVE_LLM_TESTS: "false"
      OPENAI_API_KEY: ""
      GEMINI_API_KEY: ""
      LLM_API_KEY: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Build sandbox runner image
        run: docker build -f docker/Dockerfile.runner -t ai-dev-team-runner:latest docker

      - name: Run backend tests
        env:
          GITHUB_TOKEN: ""
          GITHUB_OWNER: ""
          GITHUB_REPO: ""
          GITHUB_REPOSITORY: ""
        run: python -m pytest tests -q --tb=line

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
